<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; base-uri 'none'"><title>大盗墓时代 · 全球藏品策划预览</title>
<style>body{margin:0;background:#151d23;color:#e8edf0;font:15px/1.7 system-ui,'Microsoft YaHei',sans-serif}header{padding:28px 5%;background:#24313a}h1{color:#edc984;margin:0;font-size:28px}main{padding:24px;max-width:1400px;margin:auto}button,select,input{font:inherit;color:inherit;background:#293943;border:1px solid #596b76;padding:9px;border-radius:5px}button{cursor:pointer}.active{background:#e7c285;color:#162129}nav{display:flex;gap:10px;margin-bottom:16px}summary{cursor:pointer;padding:10px;color:#edc984}.filter-panel{border:1px solid #41525d;border-radius:6px}.filters{padding:12px;display:flex;gap:10px;flex-wrap:wrap}.filters input{flex:2}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{overflow-wrap:anywhere;word-break:break-word;white-space:pre-line;text-align:left;padding:12px;border-bottom:1px solid #41525d;vertical-align:top}th{color:#edc984}tr.data:hover{background:#293943}tr.data{cursor:pointer}.original{color:#a8bcc9;font-size:12px}.thumb{width:48px;height:48px;object-fit:contain;float:left;margin:0 10px 5px 0}.thumb-placeholder{font-size:10px;color:#a8bcc9;float:left;width:40px;margin-right:8px}.image-box img{display:block;width:100%;max-width:520px;max-height:430px;object-fit:contain}.image-box p{font-size:12px;overflow-wrap:anywhere}.placeholder{max-width:520px;height:170px;display:grid;place-items:center;background:#2a3943;color:#b2c2cc;border:1px dashed #6d7d87}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 monospace}.details{white-space:pre-wrap;line-height:1.9;background:#20303b}a{color:#9bdbef}.paging{text-align:center}footer{padding:24px;color:#a8bcc9}@media(max-width:800px){main{padding:12px}.filters>*{width:100%;min-width:0}.filters input{flex:auto;width:100%}nav{flex-wrap:wrap}table{table-layout:fixed}th,td{padding:8px;font-size:12px}.thumb{width:48px;height:48px;object-fit:contain;float:left;margin:0 10px 5px 0}.thumb-placeholder{font-size:10px;color:#a8bcc9;float:left;width:40px;margin-right:8px}.image-box img{max-height:300px}th:nth-child(3),td:nth-child(3){display:none}}</style></head><body>
<header><h1>全球藏品 · 中文图鉴与策划候选</h1><p id="summary"></p><p>离线只读。来源校验 ≠ 人工审订。正式八件古董与候选隔离；只展示已核验许可的本地图片，不自动访问第三方媒体。</p></header>
<main><nav><button data-view="objects" class="active">真实馆藏</button><button data-view="articles">图鉴草稿</button><button data-view="candidates">游戏候选</button><button data-view="exhibitions">专题展览</button></nav><details class="filter-panel"><summary>筛选文明、地区、年代、机构与许可</summary><div class="filters"><input id="search" placeholder="搜索中英文名称、馆藏号、简介"><select id="culture" aria-label="文明筛选"></select><select id="region" aria-label="地区筛选"></select><select id="history" aria-label="历史时期筛选"></select><select id="institution" aria-label="收藏机构筛选"></select><select id="media" aria-label="媒体授权筛选"></select><select id="category" aria-label="器物类别筛选"></select><select id="geology" aria-label="地质年代筛选"></select><select id="status" aria-label="状态筛选"></select></div></details><p id="count"></p><table><thead><tr><th>中英文名称</th><th>分类与时代</th><th>现藏机构 / 馆藏号</th><th>审核状态 / 数据许可</th></tr></thead><tbody id="rows"></tbody></table><div class="paging"><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></div></main><footer>RAW → NORMALIZED → EDITORIAL_DRAFT / GAME_CANDIDATE → 人工审核 → APPROVED → 独立发行审查 → RELEASED</footer>
<script id="catalog-data" type="application/json">__DATA__</script><script>
const catalog=JSON.parse(document.getElementById('catalog-data').textContent),byId=new Map(catalog.objects.map(x=>[x.object_id,x]));let view='objects',page=0,filtered=[];const size=25,$=id=>document.getElementById(id),node=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text??'未知 / 待补充';if(cls)e.className=cls;return e;};
$('summary').textContent=`${catalog.objects.length} 条真实馆藏 · ${catalog.articles.length} 篇待审图鉴 · ${catalog.candidates.length} 件候选 · 正式 ${catalog.released_count} 件`;
function current(){return catalog[view].map(x=>view==='objects'?x:{...byId.get(x.object_id),...x});}
function options(id,title,values){$(id).replaceChildren(new Option(title,''),...Array.from(new Set(values.filter(Boolean))).sort().map(x=>new Option(x,x)));}
function reset(){const all=current();options('culture','全部文明',all.flatMap(x=>x.cultures));options('region','全部地区',all.flatMap(x=>x.regions));options('history','全部历史时期',all.map(x=>x.historical_period));options('institution','全部收藏机构',all.map(x=>x.institution));options('media','全部媒体授权',all.flatMap(x=>x.media_licenses.length?x.media_licenses:['无媒体']));options('category','全部器物类别',all.map(x=>x.category));options('geology','全部地质年代',all.map(x=>x.geological_period));options('status','全部状态',all.map(x=>x.status));$('search').value='';filter();}
function filter(){const q=$('search').value.toLowerCase();filtered=current().filter(x=>(!$('culture').value||x.cultures.includes($('culture').value))&&(!$('region').value||x.regions.includes($('region').value))&&(!$('history').value||x.historical_period===$('history').value)&&(!$('institution').value||x.institution===$('institution').value)&&(!$('media').value||(x.media_licenses.length?x.media_licenses:['无媒体']).includes($('media').value))&&(!$('category').value||x.category===$('category').value)&&(!$('geology').value||x.geological_period===$('geology').value)&&(!$('status').value||x.status===$('status').value)&&[x.zh_name,x.original_name,x.accession_number,x.body].join(' ').toLowerCase().includes(q));page=0;render();}
function detail(x){const tr=node('tr',''),td=node('td','');td.colSpan=4;td.className='details';let text=`推荐中文名（待审）：${x.zh_name||'待补'}\n官方原文名：${x.original_name}\n文化起源地：${x.origin||'未知'}\n出土地 / 标本地点：${x.discovery||'未知'}\n制造 / 地质年代：${x.era||x.geological_period||'未知'}\n材料 / 工艺：${x.material||'未知'}\n可信度：${x.confidence}\n媒体许可：${x.media_summary}\n\n${x.body||'尚无本件专属图鉴。关联同类稿只供比较，不能替代本件知识。'}`;
if(x.game_id)text+=`\n\n候选：${x.game_id}\n建议 ¥${x.suggested_value} · ${x.suggested_slots}格 · 吸引力${x.suggested_appeal} · ${x.suggested_rarity}\n运输：${x.transport_mode}（体量待审）\n1933：${x.world_1933.status}\n${x.world_1933.issues.join('\n')}\n获取地区（策划建议）：${x.obtain_regions.join('；')}\n图鉴：${x.article_id} / ${x.article_relation}\n${x.basis_note}`;
const imageBox=node('div','','image-box');if(x.images?.length){for(const media of x.images){const img=node('img','');img.src=media.detail_path;img.alt=x.zh_name||x.original_name;img.onerror=()=>img.replaceWith(node('div','本地图片缺失，请重建媒体缓存','placeholder'));imageBox.append(img,node('p',`${media.license_id} · ${media.attribution} · ${media.source_url}`));}}else{imageBox.append(node('div','暂无核验许可的实物图片','placeholder'));}td.append(imageBox,node('p',text));if(x.review_details){const audit=node('details',''),summary=node('summary','逐段证据、名称来源与版本差异');audit.append(summary,node('pre',JSON.stringify(x.review_details,null,2)));td.append(audit);}for(const s of x.sources){const p=node('p',`${s.source_id} / ${s.record_id} · 数据 ${s.license_id} `);if(/^https?:\/\//i.test(s.record_url)){const a=node('a','原始资料链接');a.href=s.record_url;a.target='_blank';a.rel='noopener noreferrer';p.append(a);}td.append(p);}tr.append(td);tr.className='expanded';return tr;}
const categoryLabels={ARCHAEOLOGICAL_ARTIFACT:'考古器物',ARTWORK:'艺术品',HISTORICAL_OBJECT:'历史器物',FOSSIL_SPECIMEN:'化石标本',MINERAL_SPECIMEN:'矿物标本',METEORITE:'陨石',ROCK_SPECIMEN:'岩石标本',NUMISMATIC_OBJECT:'钱币'};const statusLabel=x=>x==='NORMALIZED'?'清洗资料':x==='CANDIDATE'?'策划候选':x.startsWith('EDITORIAL_DRAFT')?'图鉴待审':x;function render(){$('rows').replaceChildren();for(const x of filtered.slice(page*size,(page+1)*size)){const tr=node('tr','','data'),td=node('td','');if(x.images?.length){const thumb=node('img','','thumb');thumb.src=x.images[0].thumb_path;thumb.alt='已核验实物缩略图';thumb.onerror=()=>thumb.replaceWith(node('span','暂无图','thumb-placeholder'));td.append(thumb);}else td.append(node('span','暂无图','thumb-placeholder'));td.append(node('div',x.zh_name||'中文名称待审订'),node('div',x.original_name,'original'));tr.append(td,node('td',`${categoryLabels[x.category]||x.category}\n${x.era||x.geological_period||'年代未知'}`),node('td',`${x.institution||'机构未知'}\n${x.accession_number}`),node('td',`${statusLabel(x.status)}\n${x.sources.map(s=>s.license_id).join(' / ')}`));tr.onclick=()=>{if(tr.nextSibling?.classList.contains('expanded'))tr.nextSibling.remove();else tr.after(detail(x));};$('rows').append(tr);}const pages=Math.max(1,Math.ceil(filtered.length/size));$('count').textContent=`筛选结果 ${filtered.length} 条 · 点击行查看简介、来源和审核边界`;$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page+1>=pages;}
for(const id of ['search','culture','region','history','institution','media','category','geology','status'])$(id).addEventListener('input',filter);for(const b of document.querySelectorAll('nav button'))b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));reset();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};reset();
</script></body></html>
